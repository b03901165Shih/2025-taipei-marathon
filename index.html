<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <head>
  <title>2025-2026北部重要馬拉松賽事 - 名次統計工具</title>
  <meta name="description" content="即時查詢馬拉松完賽分布、42K名次排名、個人成績分析。支援姓名、分組搜尋。">
  <meta name="keywords" content="馬拉松完賽分布,完賽成績,42K名次,21K名次,馬拉松查詢">
  </head>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI"; margin: 0; background: #f5f7fb; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
    h1 { margin-bottom: 4px; }
    h2 { margin-top: 32px; }
    .card { background: #fff; border-radius: 16px; padding: 20px 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.07); margin-top: 16px; }
    .row { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; margin-bottom: 15px; }
    select, input { padding: 8px 15px; font-size: 17px; border-radius: 8px; border: 1px solid #d1d5db; min-width: 120px; }
    button { padding: 8px 16px; border-radius: 8px; border: none; background: #2563eb; color: #fff; cursor: pointer; font-size: 17px; }
    button:hover { background: #1d4ed8; }
    .label { font-size: 17px; color: #555; min-width: 70px; }
    #chartContainer { height: 400px; }
    canvas { max-width: 100%; max-height: 100%; }
    .result-block { margin-top: 15px; padding: 15px 17px; border-radius: 10px; background: #f9fafb; border: 1px solid #e5e7eb; }
    .result-title { font-weight: 600; margin-bottom: 6px; color: #111827; }
    .result-line { font-size: 16px; color: #374151; }
    .result-line span.value { font-weight: 600; color: #111827; }
    .time-input-group { display: flex; align-items: center; gap: 4px; }
    .time-input-group input { width: 60px; text-align: center; }
    .pr-time { font-size: 18px; font-weight: 700; color: #059669; margin: 8px 0; }
    /* 美觀表格樣式 */
    table { 
      font-size: 17px; 
      width: 100%; 
      border-collapse: separate; 
      border-spacing: 0;
      margin-top: 15px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    th, td { 
      padding: 10px 15px; 
      text-align: center; 
      border-bottom: 1px solid #e5e7eb; 
    }

    th { 
      font-weight: 600; 
      font-size: 17px; 
      color: #1f2937; 
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      border-bottom: 2px solid #e2e8f0;
    }

    td { 
      color: #374151; 
      background: #ffffff;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover { 
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%) !important;
      transform: scale(1.01);
      transition: all 0.2s ease;
    }

    td:nth-child(2), td:nth-child(3), td:nth-child(4), td:nth-child(5) {
      text-align: center; 
      font-weight: 500;
    }

    /* 數字高亮 */
    td:nth-child(4) { /* PR 欄 */
      color: #059669;
      font-weight: 600;
    }

  </style>
</head>
<body>
<div class="wrap">
  <h1>🏃‍♂️ 2026 北部重要馬拉松賽事 - 名次統計工具</h1>
  <div style="color:#6b7280;font-size:17px;">成績來源: Brav elog. 以大會成績(Official Time)為準.</div>

  <!-- 新資料載入：支援無限賽事擴充！ -->
  <script src="2025_tpe_data.js"></script>
  <script src="2026_chartered_tpe_data.js"></script>
  <script src="2026_freeway_tpe_data.js"></script>
  <script src="2026_puma_night_run_data.js"></script>
  <script src="2026_panasonic_tpe_data.js"></script>
  <script src="2026_nat_geo_run_data.js"></script>
  

  <!-- 區塊 1：互動式 histogram -->
  <h2>1. 分組完賽時間分布 (histogram)</h2>
  <div class="card">
    <div class="row">
      <div class="label">賽事：</div>
      <select id="eventSelect"></select>

      <div class="label">賽別：</div>
      <select id="raceSelect"></select>

      <div class="label">分組：</div>
      <select id="groupSelect"></select>
    </div>
    <div id="chartContainer">
      <canvas id="histCanvas"></canvas>
    </div>
    <div id="chartStatus" class="result-block" style="display:none;"></div>
  </div>

  <!-- 區塊 2：輸入時間 → 查總場 & 性別 & 細部分組排名/PR -->
  <h2>2. 輸入時間，查總場 / 性別 / 分組排名 & PR</h2>
  <div class="card">
    <div class="row">
      <div class="label">賽事：</div>
      <select id="eventForPr"></select>

      <div class="label">賽別：</div>
      <select id="raceForPr"></select>

      <div class="label">分組類型：</div>
      <select id="groupForPr"></select>
    </div>

    <div class="row">
      <div class="label">完賽時間：</div>
      <div class="time-input-group">
        <input id="hInput" type="number" min="0" max="23" placeholder="HH"> :
        <input id="mInput" type="number" min="0" max="59" placeholder="MM"> :
        <input id="sInput" type="number" min="0" max="59" placeholder="SS">
      </div>
      <button id="btnCheckPr">查詢排名 / PR</button>
    </div>

    <div id="prResultArea"></div>
  </div>

  <!-- 區塊 3：輸入 PR 值 → 查剛好超越的時間 -->
  <h2>3. 輸入 PR 值，查剛好超越的時間</h2>
  <div class="card">
    <div class="row">
      <div class="label">賽事：</div>
      <select id="eventForPrReverse"></select>

      <div class="label">賽別：</div>
      <select id="raceForPrReverse"></select>

      <div class="label">分組：</div>
      <select id="groupForPrReverse">
        <!-- 動態填入 ALL / 各細分組 -->
      </select>
    </div>

    <div class="row">
      <div class="label">PR 值：</div>
      <input id="prInput" type="number" min="0" max="100" step="0.1" placeholder="0 ~ 100">
      <button id="btnCheckPrReverse">查詢對應時間</button>
    </div>

    <div id="prReverseResultArea"></div>
  </div>

  <!-- 區塊 4：跨賽事比較 -->
  <h2>4. 同一時間跨賽事排名 / PR 比較</h2>
  <div class="card">
    <div class="row">
      <div class="label">參考賽事：</div>
      <select id="referenceEventSelect"></select>

      <div class="label">參考賽別：</div>
      <select id="referenceRaceSelect"></select>
    </div>

    <div class="row">
      <div class="label">完賽時間：</div>
      <div class="time-input-group">
        <input id="compareHInput" type="number" min="0" max="23" placeholder="HH"> :
        <input id="compareMInput" type="number" min="0" max="59" placeholder="MM"> :
        <input id="compareSInput" type="number" min="0" max="59" placeholder="SS">
      </div>
      <button id="btnCompareEvents">比較所有賽事</button>
    </div>

    <div id="compareEventsResultArea"></div>
  </div>

</div>

<script>
  // 🌟 新架構：自動偵測所有賽事！
  let marathonData = window.marathonData || {};
  let raceHierarchy = {};
  let histChart = null;

  // ---------- 🔧 核心工具函式（改進版） ----------
  function getAllEvents() {
    return Object.keys(window.marathonData).map(id => window.marathonData[id].metadata);
  }

  function getSortedEvents() {
    return getAllEvents().sort((a, b) => (a.event_date || "").localeCompare(b.event_date || ""));
  }

  function getEventData(eventId) {
    return window.marathonData[eventId];
  }

  function getEventIdFromName(eventName) {
    return getAllEvents().find(e => e.event_name === eventName)?.event_id;
  }

  function eventHasBins(eventId) {
    return Object.keys(getEventData(eventId)?.binsAndPr || {}).length > 0;
  }

  function getPendingEventMessage(eventId) {
    const metadata = getEventData(eventId)?.metadata || {};
    return metadata.notes || "此賽事已加入 repo，但完整成績資料仍待匯入。";
  }

  // ✅ 修復：正確解析完整 key
  function parseFullKey(fullKey) {
    // 🎯 新格式：eventId__raceType__group （三個 __）
    // 範例：
    // "2025_tpe__HM__男視障選手"           → {eventId: "2025_tpe", raceType: "HM", group: "男視障選手"}
    // "2026_chartered_tpe__全程馬拉松(42.195KM)__男60歲+" → {eventId: "2026_chartered_tpe", raceType: "全程馬拉松(42.195KM)", group: "男60歲+"}
    
    const parts = fullKey.split('__', 3);
    if (parts.length !== 3) {
      console.error("❌ Key 格式錯誤，必須有兩個 __ 分隔：", fullKey);
      return null;
    }
    
    const eventId = parts[0];   // 2025_tpe
    const raceType = parts[1];  // HM 或 全程馬拉松(42.195KM)
    const group = parts[2];     // 男視障選手 或 男60歲+
    
    return { eventId, raceType, group };
  }


  // ✅ 產生完整 key
  function getFullKey(eventId, raceType, group) {
    // 產生新格式：eventId__raceType__group
    return `${eventId}__${raceType}__${group}`;
  }
  // ---------- 小工具 ----------
  function classifyGroup(rawGroup) {
    const g = String(rawGroup);
    if (g.includes("輪椅")) return "輪椅";
    if (g.includes("視障")) return "視障";
    return "一般";
  }

  function secondsToTime(sec) {
    sec = Math.floor(sec);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }

  function timeToSeconds(h, m, s) {
    return h*3600 + m*60 + s;
  }

  function parseTimeInputs() {
    const h = parseInt(document.getElementById("hInput").value, 10);
    const m = parseInt(document.getElementById("mInput").value, 10);
    const s = parseInt(document.getElementById("sInput").value, 10);
    if (Number.isNaN(h) || Number.isNaN(m) || Number.isNaN(s)) {
      alert("請輸入完整的 HH:MM:SS");
      return null;
    }
    if (h < 0 || h > 23 || m < 0 || m > 59 || s < 0 || s > 59) {
      alert("時間格式錯誤，請確認在 00:00:00 ~ 23:59:59 之間");
      return null;
    }
    return timeToSeconds(h, m, s);
  }

  // binary search：已排序陣列 arr (由小到大)，尋找 first index 使得 arr[idx] >= target
  function lowerBound(arr, target) {
    let lo = 0, hi = arr.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (arr[mid] < target) {
        lo = mid + 1;
      } else {
        hi = mid;
      }
    }
    return lo;
  }

  function parseCompareTimeInputs() {
    const h = parseInt(document.getElementById("compareHInput").value, 10);
    const m = parseInt(document.getElementById("compareMInput").value, 10);
    const s = parseInt(document.getElementById("compareSInput").value, 10);
    if (Number.isNaN(h) || Number.isNaN(m) || Number.isNaN(s) ||
        h < 0 || h > 23 || m < 0 || m > 59 || s < 0 || s > 59) {
      alert("請輸入完整且有效的 HH:MM:SS");
      return null;
    }
    return timeToSeconds(h, m, s);
  }

  function getRaceTypesForEvent(eventId) {
    const data = getEventData(eventId);
    const raceTypes = new Set();
    Object.keys(data?.binsAndPr || {}).forEach(key => {
      const parsed = parseFullKey(key);
      if (parsed?.eventId === eventId) raceTypes.add(parsed.raceType);
    });
    return [...raceTypes];
  }

  function getGenderSeconds(eventId, raceType, gender) {
    const data = getEventData(eventId);
    const seconds = [];
    Object.entries(data?.binsAndPr || {}).forEach(([key, obj]) => {
      const parsed = parseFullKey(key);
      if (!parsed || parsed.eventId !== eventId || parsed.raceType !== raceType) return;
      if (parsed.group === "ALL" || !parsed.group.includes(gender)) return;
      if (Array.isArray(obj?.sorted_seconds)) seconds.push(...obj.sorted_seconds);
    });
    return seconds.sort((a, b) => a - b);
  }

  function getMetrics(sortedSeconds, sec) {
    if (!sortedSeconds?.length) return null;
    const index = lowerBound(sortedSeconds, sec);
    const total = sortedSeconds.length;
    const rank = index + 1;
    const slower = Math.max(0, total - index);
    return { rank, total, pr: (slower / total) * 100 };
  }

  function getRaceMetrics(eventId, raceType, sec) {
    const allSeconds = getEventData(eventId)?.binsAndPr?.[
      getFullKey(eventId, raceType, "ALL")
    ]?.sorted_seconds;
    return {
      all: getMetrics(allSeconds, sec),
      male: getMetrics(getGenderSeconds(eventId, raceType, "男"), sec),
      female: getMetrics(getGenderSeconds(eventId, raceType, "女"), sec),
    };
  }

  function formatRank(metric) {
    return metric ? `${metric.rank.toLocaleString()} / ${metric.total.toLocaleString()}` : "—";
  }

  function formatPr(metric) {
    return metric ? `${metric.pr.toFixed(2)}%` : "—";
  }

  function fillReferenceEventSelect() {
    const eventSelect = document.getElementById("referenceEventSelect");
    eventSelect.innerHTML = "";
    getSortedEvents().filter(event => eventHasBins(event.event_id)).forEach(event => {
      const option = document.createElement("option");
      option.value = event.event_name;
      option.textContent = event.event_name;
      option.dataset.eventId = event.event_id;
      eventSelect.appendChild(option);
    });
  }

  function updateReferenceRaceSelect() {
    const eventName = document.getElementById("referenceEventSelect").value;
    updateRaceSelect(eventName, "referenceRaceSelect");
  }

  function compareEvents() {
    const sec = parseCompareTimeInputs();
    if (sec == null) return;

    const referenceEventId = getEventIdFromName(
      document.getElementById("referenceEventSelect").value
    );
    const referenceRaceType = document.getElementById("referenceRaceSelect").value;
    const resultArea = document.getElementById("compareEventsResultArea");
    resultArea.innerHTML = "";

    const referenceMetrics = getRaceMetrics(referenceEventId, referenceRaceType, sec);
    if (!referenceMetrics.all) {
      resultArea.innerHTML = '<div class="result-block">參考賽事／賽別沒有完整成績資料。</div>';
      return;
    }

    const referencePr = referenceMetrics.all.pr;

    const tableWrap = document.createElement("div");
    tableWrap.style.overflowX = "auto";
    const table = document.createElement("table");
    table.style.cssText = "width:100%;border-collapse:collapse;margin-top:15px;font-size:15px;background:#fff;";
    table.innerHTML = `
      <thead style="display:table-header-group;background:#e2e8f0;color:#111827;">
        <tr style="display:table-row;">
          <th scope="col">賽事</th><th scope="col">賽別</th>
          <th scope="col">總場排名</th><th scope="col">總場 PR</th>
          <th scope="col">男性排名</th><th scope="col">男性 PR</th>
          <th scope="col">女性排名</th><th scope="col">女性 PR</th>
        </tr>
      </thead><tbody></tbody>`;
    const tbody = table.querySelector("tbody");

    getSortedEvents().filter(event => eventHasBins(event.event_id)).forEach(event => {
      let selectedRaceType = referenceRaceType;
      let metrics;

      if (event.event_id === referenceEventId) {
        metrics = referenceMetrics;
      } else {
        const candidates = getRaceTypesForEvent(event.event_id)
          .map(raceType => ({ raceType, metrics: getRaceMetrics(event.event_id, raceType, sec) }))
          .filter(candidate => candidate.metrics.all);
        if (!candidates.length) return;
        candidates.sort((a, b) => {
          const aPr = a.metrics.all.pr;
          const bPr = b.metrics.all.pr;
          return Math.abs(aPr - referencePr) - Math.abs(bPr - referencePr);
        });
        selectedRaceType = candidates[0].raceType;
        metrics = candidates[0].metrics;
      }

      appendCompareRow(tbody, event, selectedRaceType, sec);
    });
    table.querySelectorAll("th").forEach(cell => {
      cell.style.cssText = `
        display: table-cell;
        padding: 10px;
        background: #e2e8f0;
        border-bottom: 2px solid #94a3b8;
        text-align: center;
        white-space: nowrap;
        font-weight: 700;
        font-size: 15px;
        color: #111827;
      `;
    });
    tableWrap.appendChild(table);
    resultArea.appendChild(tableWrap);
  }

  function appendCompareRow(tbody, event, raceType, sec) {
    const metrics = getRaceMetrics(event.event_id, raceType, sec);
    const row = document.createElement("tr");
    const raceOptions = getRaceTypesForEvent(event.event_id)
      .map(type => `<option value="${type}" ${type === raceType ? "selected" : ""}>${type}</option>`)
      .join("");
    row.innerHTML = `
      <td>${event.event_name}</td>
      <td><select class="compare-race-select" data-event-id="${event.event_id}">${raceOptions}</select></td>
      <td>${formatRank(metrics.all)}</td><td>${formatPr(metrics.all)}</td>
      <td>${formatRank(metrics.male)}</td><td>${formatPr(metrics.male)}</td>
      <td>${formatRank(metrics.female)}</td><td>${formatPr(metrics.female)}</td>`;
    row.querySelectorAll("td").forEach(cell => {
      cell.style.cssText = "padding:9px 10px;border-bottom:1px solid #e5e7eb;text-align:center;white-space:nowrap;";
    });
    row.firstElementChild.style.textAlign = "left";
    const raceSelect = row.querySelector(".compare-race-select");
    raceSelect.addEventListener("change", () => updateCompareRow(row, event.event_id, raceSelect.value, sec));
    tbody.appendChild(row);
  }

  function updateCompareRow(row, eventId, raceType, sec) {
    const metrics = getRaceMetrics(eventId, raceType, sec);
    const cells = row.querySelectorAll("td");
    cells[2].textContent = formatRank(metrics.all);
    cells[3].textContent = formatPr(metrics.all);
    cells[4].textContent = formatRank(metrics.male);
    cells[5].textContent = formatPr(metrics.male);
    cells[6].textContent = formatRank(metrics.female);
    cells[7].textContent = formatPr(metrics.female);
  }

  // ---------- 🏗️ 自動建立階層結構 ----------
  function buildRaceHierarchy() {
    raceHierarchy = {};
    
    getAllEvents().forEach(event => {
      const eventId = event.event_id;
      const eventName = event.event_name;
      raceHierarchy[eventName] = {};
      
      const data = getEventData(eventId);
      if (!data?.binsAndPr) return;
      
      Object.keys(data.binsAndPr).forEach(fullKey => {
        const parsed = parseFullKey(fullKey);
        if (!parsed) return;
        
        const { raceType, group } = parsed;
        if (!raceHierarchy[eventName][raceType]) {
          raceHierarchy[eventName][raceType] = new Set();
        }
        raceHierarchy[eventName][raceType].add(group);
      });
      
      // 排序分組
      Object.keys(raceHierarchy[eventName]).forEach(raceType => {
        const groups = Array.from(raceHierarchy[eventName][raceType]);
        groups.sort((a, b) => a === "ALL" ? -1 : (b === "ALL" ? 1 : a.localeCompare(b, "zh-Hant")));
        raceHierarchy[eventName][raceType] = groups;
      });
    });
    
    console.log("🏗️ 階層結構：", raceHierarchy);
  }

  // ---------- 🎛️ 選擇器填充 ----------
  function fillEventSelects() {
    const events = getSortedEvents();
    
    // 只填充賽事選單
    ["eventSelect", "eventForPr", "eventForPrReverse"].forEach(selectId => {
      const select = document.getElementById(selectId);
      if (!select) return;
      select.innerHTML = "";
      events.forEach(event => {
        const opt = document.createElement("option");
        opt.value = event.event_name;
        opt.textContent = event.event_name;
        opt.dataset.eventId = event.event_id;
        select.appendChild(opt);
      });
    });
    
    // ✅ 確保分組類型選單永遠有值
    const groupForPr = document.getElementById("groupForPr");
    if (groupForPr && !groupForPr.querySelector('option')) {
      groupForPr.innerHTML = `
        <option value="一般" selected>一般</option>
        <option value="輪椅">輪椅</option>
        <option value="視障">視障</option>
      `;
    }
  }


  function updateRaceSelect(eventName, selectId) {
    const raceSelect = document.getElementById(selectId);
    if (!raceSelect) return;

    raceSelect.innerHTML = "";
    const eventId = getEventIdFromName(eventName);
    const metadataRaceTypes = getEventData(eventId)?.metadata?.race_types || [];
    const raceTypes = Object.keys(raceHierarchy[eventName] || {}).sort();
    const finalRaceTypes = raceTypes.length ? raceTypes : metadataRaceTypes;

    finalRaceTypes.forEach(rt => {
      const opt = document.createElement("option");
      opt.value = rt;
      opt.textContent = rt;
      raceSelect.appendChild(opt);
    });
  }

  function updateGroupSelect(eventName, raceType, selectId) {
    const groupSelect = document.getElementById(selectId);
    if (!groupSelect) return;

    groupSelect.innerHTML = "";
    const eventId = getEventIdFromName(eventName);
    const groups = raceHierarchy[eventName]?.[raceType] || (eventHasBins(eventId) ? [] : ["ALL"]);

    groups.forEach(g => {
      const opt = document.createElement("option");
      opt.value = g;
      opt.textContent = (g === "ALL") ? "ALL (所有人)" : g;
      groupSelect.appendChild(opt);
    });
  }

  
  // ✅ **新增：分組類型選擇器**
  function updateGroupTypeSelect(eventName, raceType) {
    // groupForPr 是固定的：一般/輪椅/視障，不需要更新
    console.log("分組類型已預設：一般/輪椅/視障");
  }
  
  // 📊 Histogram
  function drawHistogram() {
    const chartStatus = document.getElementById("chartStatus");
    const eventName = document.getElementById("eventSelect").value;
    const raceType = document.getElementById("raceSelect").value;
    const group = document.getElementById("groupSelect").value;
    const eventSelect = document.getElementById("eventSelect");
    const eventId = eventSelect.selectedOptions[0].dataset.eventId;

    chartStatus.style.display = "none";
    chartStatus.textContent = "";

    if (!eventHasBins(eventId)) {
      if (histChart) histChart.destroy();
      chartStatus.style.display = "block";
      chartStatus.textContent = `📦 ${eventName}：${getPendingEventMessage(eventId)}`;
      return;
    }

    if (!raceType || !group) {
      chartStatus.style.display = "block";
      chartStatus.textContent = "請先選擇賽別和分組。";
      return;
    }

    const fullKey = getFullKey(eventId, raceType, group);
    const eventData = getEventData(eventId);
    const obj = eventData?.binsAndPr?.[fullKey];

    if (!obj?.histogram_5min) {
      chartStatus.style.display = "block";
      chartStatus.textContent = `找不到資料：${eventName} / ${raceType} / ${group}`;
      return;
    }
    
    const bins = obj.histogram_5min;
    const labels = bins.map(b => b.start_time);
    const counts = bins.map(b => b.count);
    
    const ctx = document.getElementById("histCanvas").getContext("2d");
    if (histChart) histChart.destroy();
    
    histChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels,
        datasets: [{
          label: `${eventName} / ${raceType} / ${group}`,
          data: counts,
          backgroundColor: "rgba(37,99,235,0.75)",
          borderColor: "rgba(30,64,175,1)",
          borderWidth: 1,
          borderRadius: 4,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: true },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const i = ctx.dataIndex;
                const b = bins[i];
                return [`人數: ${b.count}`, `區間: ${b.start_time} ~ ${b.end_time}`];
              }
            }
          }
        },
        scales: {
          x: { title: { display: true, text: "完賽時間 (5 分鐘區間)" }, ticks: { maxRotation: 45, minRotation: 45 } },
          y: { beginAtZero: true, title: { display: true, text: "人數" } }
        }
      }
    });
  }

  function lookupPrForTime() {
    const sec = parseTimeInputs();
    if (sec == null) return;

    const eventName = document.getElementById("eventForPr").value;
    const raceType = document.getElementById("raceForPr").value;
    const bucketType = document.getElementById("groupForPr").value;
    const eventSelect = document.getElementById("eventForPr");
    if (!eventSelect?.selectedOptions[0]?.dataset.eventId) {
      alert("請先選擇賽事");
      return;
    }
    
    const eventId = eventSelect.selectedOptions[0].dataset.eventId;
    const eventData = getEventData(eventId);
    const resultArea = document.getElementById("prResultArea");
    resultArea.innerHTML = "";

    if (!eventHasBins(eventId)) {
      resultArea.innerHTML = `<div class="result-block">📦 ${eventName}：${getPendingEventMessage(eventId)}</div>`;
      return;
    }

    if (!eventData?.binsAndPr) {
      resultArea.innerHTML = `<div class="result-block">找不到賽事資料</div>`;
      return;
    }

    // 🔧 安全數字格式化函式
    function safeLocale(n) {
      return (n || 0).toLocaleString();
    }

    console.log("🔍 賽事ID:", eventId);
    console.log("🔍 賽別:", raceType);
    console.log("🔍 所有 keys:", Object.keys(eventData.binsAndPr || {}));
    // 1) 全場 ALL ✅ 安全檢查
    const allKey = getFullKey(eventId, raceType, "ALL");
    const allObj = eventData.binsAndPr[allKey];
    
    console.log("🔍 預期 ALL key:", allKey);
    console.log("🔍 ALL key 存在？", !!eventData.binsAndPr?.[allKey]);
    // 在 lookupPrForTime() 開頭加入：
    console.log("🔍 檢查 ALL key:", allKey, "→", !!eventData.binsAndPr[allKey]);

    // 遍歷時加入 debug：
    Object.keys(eventData.binsAndPr).forEach(fullKey => {
      const parsed = parseFullKey(fullKey);
      if (parsed && parsed.eventId === eventId && parsed.raceType === raceType) {
        console.log("✅ 找到匹配分組:", parsed.group, classifyGroup(parsed.group));
      }
    });
    
    
    if (allObj?.sorted_seconds?.length > 0) {
      const allArr = allObj.sorted_seconds;
      const N_all = allArr.length;
      const idxAll = lowerBound(allArr, sec);
      const rankAll = idxAll + 1;
      const slowerAll = Math.max(0, N_all - idxAll);
      const prAll = ((slowerAll / N_all) * 100).toFixed(2);

      const blockAll = document.createElement("div");
      blockAll.className = "result-block";
      blockAll.innerHTML = `
        <div class="result-title">${eventName} / ${raceType} / ALL (全場)</div>
        <div class="result-line">總人數：<span class="value">${safeLocale(N_all)}</span></div>
        <div class="result-line">你的時間：<span class="value">${secondsToTime(sec)}</span></div>
        <div class="result-line">總場排名：<span class="value">${safeLocale(rankAll)}</span></div>
        <div class="result-line">PR 值：<span class="value">${prAll}%</span>（贏過 ${safeLocale(slowerAll)} 人）</div>
      `;
      resultArea.appendChild(blockAll);
    } else {
      const blockAll = document.createElement("div");
      blockAll.className = "result-block";
      blockAll.innerHTML = `<div class="result-title">${eventName} / ${raceType} / ALL</div><div class="result-line">無資料</div>`;
      resultArea.appendChild(blockAll);
    }

    // 2) 性別彙總 + 細分組
    const maleArr = [], femaleArr = [], groupRows = [];

    Object.keys(eventData.binsAndPr).forEach(fullKey => {
      const parsed = parseFullKey(fullKey);
      
      // 🔥 關鍵：先篩 ALL，再篩 bucketType
      if (!parsed || parsed.eventId !== eventId || parsed.raceType !== raceType) return;
      if (parsed.group === "ALL") return;  // ✅ 先篩 ALL
      if (classifyGroup(parsed.group) !== bucketType) return;  // ✅ 再篩分組類型
      
      const obj = eventData.binsAndPr[fullKey];
      
      console.log(`🔍 分組 ${parsed.group}:`, {
        hasSortedSeconds: !!obj?.sorted_seconds,
        length: obj?.sorted_seconds?.length,
        sample: obj?.sorted_seconds?.slice(0, 3)
      });
      
      if (!obj?.sorted_seconds || obj.sorted_seconds.length === 0) {
        console.log(`❌ ${parsed.group} 無 sorted_seconds 資料`);
        return;
      }

      const arr = obj.sorted_seconds;
      const N = arr.length;
      
      if (parsed.group.includes("男")) maleArr.push(...arr);
      else if (parsed.group.includes("女")) femaleArr.push(...arr);

      const idx = lowerBound(arr, sec);
      const rank = idx + 1;
      const slower = Math.max(0, N - idx);
      const pr = (slower / N) * 100;
      
      groupRows.push({ groupName: parsed.group, rank, total: N, pr, slower });
    });

    // 男性合計
    if (maleArr.length > 0) {
      maleArr.sort((a,b) => a-b);
      const N_m = maleArr.length;
      const idxM = lowerBound(maleArr, sec);
      const rankM = idxM + 1;
      const slowerM = Math.max(0, N_m - idxM);
      const prM = ((slowerM / N_m) * 100).toFixed(2);

      const blockM = document.createElement("div");
      blockM.className = "result-block";
      blockM.innerHTML = `
        <div class="result-title">${eventName} / ${raceType} / ${bucketType} / 男性合計</div>
        <div class="result-line">總人數：<span class="value">${safeLocale(N_m)}</span></div>
        <div class="result-line">排名：<span class="value">${safeLocale(rankM)}</span></div>
        <div class="result-line">PR 值：<span class="value">${prM}%</span>（贏過 ${safeLocale(slowerM)} 人）</div>
      `;
      resultArea.appendChild(blockM);
    }

    // 女性合計
    if (femaleArr.length > 0) {
      femaleArr.sort((a,b) => a-b);
      const N_f = femaleArr.length;
      const idxF = lowerBound(femaleArr, sec);
      const rankF = idxF + 1;
      const slowerF = Math.max(0, N_f - idxF);
      const prF = ((slowerF / N_f) * 100).toFixed(2);

      const blockF = document.createElement("div");
      blockF.className = "result-block";
      blockF.innerHTML = `
        <div class="result-title">${eventName} / ${raceType} / ${bucketType} / 女性合計</div>
        <div class="result-line">總人數：<span class="value">${safeLocale(N_f)}</span></div>
        <div class="result-line">排名：<span class="value">${safeLocale(rankF)}</span></div>
        <div class="result-line">PR 值：<span class="value">${prF}%</span>（贏過 ${safeLocale(slowerF)} 人）</div>
      `;
      resultArea.appendChild(blockF);
    }
  
    // 細分組表格（完美版）
    const listBlock = document.createElement("div");
    listBlock.className = "result-block";
    const header = document.createElement("div");
    header.className = "result-title";
    header.textContent = `${eventName} / ${raceType} / ${bucketType} 各細部分組`;
    listBlock.appendChild(header);

    if (groupRows.length === 0) {
      const line = document.createElement("div");
      line.className = "result-line";
      line.textContent = `此賽別「${bucketType}」類型無資料`;
      listBlock.appendChild(line);
    } else {
      groupRows.sort((a, b) => a.groupName.localeCompare(b.groupName, "zh-Hant"));
      const table = document.createElement("table");
      table.innerHTML = `
        <thead>
          <tr>
            <th style="text-align:left;padding:12px 15px;font-weight:700;background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 100%);color:#1f2937;border-bottom:2px solid #e2e8f0;font-size:17px;">分組</th>
            <th style="padding:12px 15px;font-weight:700;background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 100%);color:#1f2937;border-bottom:2px solid #e2e8f0;font-size:17px;">排名</th>
            <th style="padding:12px 15px;font-weight:700;background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 100%);color:#1f2937;border-bottom:2px solid #e2e8f0;font-size:17px;">總人數</th>
            <th style="padding:12px 15px;font-weight:700;background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 100%);color:#1f2937;border-bottom:2px solid #e2e8f0;font-size:17px;">PR</th>
            <th style="padding:12px 15px;font-weight:700;background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 100%);color:#1f2937;border-bottom:2px solid #e2e8f0;font-size:17px;">贏過人數</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;
      
      const tbody = table.querySelector("tbody");
      groupRows.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td style="text-align:left;padding:10px 15px;">${r.groupName}</td>
          <td style="padding:10px 15px;text-align:center;font-weight:500;">${safeLocale(r.rank)}</td>
          <td style="padding:10px 15px;text-align:center;font-weight:500;">${safeLocale(r.total)}</td>
          <td style="padding:10px 15px;text-align:center;color:#059669;font-weight:600;">${r.pr.toFixed(2)}%</td>
          <td style="padding:10px 15px;text-align:center;font-weight:500;">${safeLocale(r.slower)}</td>
        `;
        tbody.appendChild(tr);
      });
      
      // 🔥 加上 hover 動畫
      table.style.cssText = `
        width: 100%; 
        border-collapse: collapse; 
        border-radius: 8px; 
        overflow: hidden; 
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        font-size: 17px;
      `;
      
      listBlock.appendChild(table);
    }
    resultArea.appendChild(listBlock);

  }


  // ⏱️ PR反查
  function lookupTimeForPr() {
    const prPct = parseFloat(document.getElementById("prInput").value);
    if (isNaN(prPct) || prPct < 0 || prPct > 100) {
      alert("請輸入 0 ~ 100 之間的 PR 值");
      return;
    }

    const eventName = document.getElementById("eventForPrReverse").value;
    const raceType = document.getElementById("raceForPrReverse").value;
    const group = document.getElementById("groupForPrReverse").value;
    const eventId = document.getElementById("eventForPrReverse").selectedOptions[0].dataset.eventId;
    const fullKey = getFullKey(eventId, raceType, group);
    const eventData = getEventData(eventId);
    const resultArea = document.getElementById("prReverseResultArea");
    resultArea.innerHTML = "";

    if (!eventHasBins(eventId)) {
      resultArea.innerHTML = `<div class="result-block">📦 ${eventName}：${getPendingEventMessage(eventId)}</div>`;
      return;
    }

    const obj = eventData.binsAndPr[fullKey];

    if (!obj?.sorted_seconds) {
      resultArea.innerHTML = `<div class="result-block">找不到 ${fullKey} 的資料</div>`;
      return;
    }

    const sortedSeconds = obj.sorted_seconds;
    const N = sortedSeconds.length;
    if (N === 0) {
      resultArea.innerHTML = `<div class="result-block">此組別無完賽資料</div>`;
      return;
    }

    const slowerCount = Math.floor((prPct / 100) * N);
    const targetRank = N - slowerCount;
    
    if (targetRank > N) {
      resultArea.innerHTML = `
        <div class="result-block">
          <div class="result-title">${eventName} / ${raceType} / ${group}</div>
          <div class="result-line">總人數：<span class="value">${N.toLocaleString()}</span></div>
          <div class="pr-time">此 PR (${prPct}%) 需要第 ${targetRank} 名，但只有 ${N} 人，無法達成！</div>
        </div>
      `;
      return;
    }

    const targetTimeSec = sortedSeconds[targetRank - 1];
    const targetTimeStr = secondsToTime(targetTimeSec);

    const block = document.createElement("div");
    block.className = "result-block";
    block.innerHTML = `
      <div class="result-title">${eventName} / ${raceType} / ${group}</div>
      <div class="result-line">總人數：<span class="value">${N.toLocaleString()}</span></div>
      <div class="result-line">目標排名：<span class="value">${targetRank.toLocaleString()}</span> 名</div>
      <div class="pr-time">⏱️ 剛好 ${prPct}% PR 的時間：<span class="value">${targetTimeStr}</span></div>
      <div class="result-line">贏過：<span class="value">${slowerCount.toLocaleString()}</span> 人</div>
    `;
    resultArea.appendChild(block);
  }

  // 🚀 初始化
  function init() {
    console.log("📊 載入賽事：", getAllEvents().map(e => e.event_name));
    buildRaceHierarchy();
    fillEventSelects();
    fillReferenceEventSelect();
    updateReferenceRaceSelect();
      
    // 🔥 設定3個區塊預設值
    setDefaultForAllBlocks();
    // 🔥 Block1 自動繪製 histogram
    drawHistogram();
  }

  function setDefaultForAllBlocks() {
    const events = getSortedEvents();
    if (!events.length) return;

    const defaultEvent = [...events].reverse().find(event => eventHasBins(event.event_id)) || events[events.length - 1];
    const latestEventName = defaultEvent.event_name;
    const latestEventId = defaultEvent.event_id;

    // Block 1: Histogram
    setDefaultForBlock1(latestEventName, latestEventId);

    // Block 2: PR查詢
    setDefaultForBlock2(latestEventName, latestEventId);

    // Block 3: PR反查
    setDefaultForBlock3(latestEventName, latestEventId);
  }

  function setDefaultForBlock1(eventName, eventId) {
    const eventSelect = document.getElementById("eventSelect");
    const raceSelect = document.getElementById("raceSelect");
    const groupSelect = document.getElementById("groupSelect");
    
    if (eventSelect) {
      eventSelect.value = eventName;
      eventSelect.selectedOptions[0].dataset.eventId = eventId;
    }
    
    // 選擇第一個可用賽別
    updateRaceSelect(eventName, "raceSelect");
    const firstRaceType = document.getElementById("raceSelect")?.value;
    if (firstRaceType && groupSelect) {
      updateGroupSelect(eventName, firstRaceType, "groupSelect");
    }
  }

  function setDefaultForBlock2(eventName, eventId) {
    const eventSelect = document.getElementById("eventForPr");
    const raceSelect = document.getElementById("raceForPr");
    
    if (eventSelect) {
      eventSelect.value = eventName;
      eventSelect.selectedOptions[0].dataset.eventId = eventId;
      updateRaceSelect(eventName, "raceForPr");
    }
  }

  function setDefaultForBlock3(eventName, eventId) {
    const eventSelect = document.getElementById("eventForPrReverse");
    const raceSelect = document.getElementById("raceForPrReverse");
    const groupSelect = document.getElementById("groupForPrReverse");
    
    if (eventSelect) {
      eventSelect.value = eventName;
      eventSelect.selectedOptions[0].dataset.eventId = eventId;
      updateRaceSelect(eventName, "raceForPrReverse");
    }
    
    const firstRaceType = document.getElementById("raceForPrReverse")?.value;
    if (firstRaceType && groupSelect) {
      updateGroupSelect(eventName, firstRaceType, "groupForPrReverse");
    }
  }

    // 事件監聽器// Block1 自動更新（選單變更即時繪圖）
  document.getElementById("eventSelect").addEventListener("change", function(e) {
    const eventName = e.target.value;
    updateRaceSelect(eventName, "raceSelect");
    const raceType = document.getElementById("raceSelect").value;
    updateGroupSelect(eventName, raceType, "groupSelect");
    drawHistogram(); // 自動繪圖
  });

  document.getElementById("raceSelect").addEventListener("change", function(e) {
    const eventName = document.getElementById("eventSelect").value;
    const raceType = e.target.value;
    updateGroupSelect(eventName, raceType, "groupSelect");
    drawHistogram(); // 自動繪圖
  });

  document.getElementById("groupSelect").addEventListener("change", function() {
    drawHistogram(); // 分組變更也自動繪圖
  });

  document.getElementById("eventForPr").addEventListener("change", (e) => {
    const eventName = e.target.value;
    updateRaceSelect(eventName, "raceForPr");
  });
  document.getElementById("raceForPr").addEventListener("change", (e) => {
    const eventName = document.getElementById("eventForPr").value;
    updateGroupTypeSelect(eventName, e.target.value);
  });
  document.getElementById("btnCheckPr").addEventListener("click", lookupPrForTime);

  document.getElementById("eventForPrReverse").addEventListener("change", (e) => {
    updateRaceSelect(e.target.value, "raceForPrReverse");
    const raceType = document.getElementById("raceForPrReverse").value;
    if (raceType) updateGroupSelect(e.target.value, raceType, "groupForPrReverse");
  });
  document.getElementById("raceForPrReverse").addEventListener("change", (e) => {
    const eventName = document.getElementById("eventForPrReverse").value;
    updateGroupSelect(eventName, e.target.value, "groupForPrReverse");
  });
  document.getElementById("btnCheckPrReverse").addEventListener("click", lookupTimeForPr);

  document.getElementById("referenceEventSelect").addEventListener("change", updateReferenceRaceSelect);
  document.getElementById("btnCompareEvents").addEventListener("click", compareEvents);



  window.addEventListener("DOMContentLoaded", function() {
    init();
  });
</script>
</body>
